# Production stack for the shared VPS. Run from this folder on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Only the two web ports are published, and only on 127.0.0.1 (Caddy proxies to them).
# Postgres and Redis have no host ports, so they cannot clash with the other projects.
name: cottson

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 10s
      retries: 5
    mem_limit: 256m
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    mem_limit: 64m
    networks: [internal]

  medusa:
    image: ${REGISTRY}/cottson-medusa:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env.medusa
    environment:
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa
      REDIS_URL: redis://redis:6379
      MEDUSA_WORKER_MODE: shared
    ports:
      - "127.0.0.1:9100:9000"
    mem_limit: 640m
    networks: [internal]

  # Optional: only started with `--profile frontend`. While the storefront lives on Vercel it stays off.
  frontend:
    profiles: ["frontend"]
    image: ${REGISTRY}/cottson-frontend:latest
    restart: unless-stopped
    env_file: .env.frontend
    ports:
      - "127.0.0.1:3100:3000"
    mem_limit: 512m
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
