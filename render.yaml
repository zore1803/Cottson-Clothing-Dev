# Render Blueprint: Medusa backend + PostgreSQL + Redis (Valkey).
# The Next.js frontend is deployed separately on Vercel (root directory: frontend).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# The free plan has no Shell access, so migration + seeding + the admin user all run as
# part of the build instead (see buildCommand below):
#   - db:migrate and both seed-cottson scripts are safe to re-run, so they run on every
#     deploy and keep Medusa in sync with the catalog/pricing files.
#   - the admin user is only created once ADMIN_EMAIL/ADMIN_PASSWORD are set (below) and
#     "|| true" stops a later deploy failing once that user already exists.
# Open the deploy's build log (Logs tab, no Shell needed) to read the publishable key and
# region id that seed-cottson.ts prints — you need both in Vercel.
# Then set STORE_CORS / ADMIN_CORS / AUTH_CORS / FRONTEND_URL to your Vercel domain.

services:
  - type: web
    name: cottson-medusa
    runtime: node
    plan: free # sleeps when idle and background jobs stop while asleep; upgrade to starter to avoid that
    region: singapore # closest to India; must match the database region
    rootDir: backend
    # Migration + seeding run as part of the build, not as a preDeployCommand: on this
    # plan, preDeployCommand's exit after a successful one-off command gets misread as
    # the service crashing ("Application exited early"), failing the deploy outright
    # even though the command itself succeeded. Bundling it into the build sidesteps
    # that, and also works around the free plan having no Shell access.
    buildCommand: >-
      npm ci && npm run build --workspace @dtc/backend && cd apps/backend &&
      npx medusa db:migrate &&
      npx medusa exec ./src/scripts/seed-cottson.ts &&
      npx medusa exec ./src/scripts/seed-cottson-pricing.ts &&
      ([ -z "$ADMIN_EMAIL" ] || npx medusa user -e "$ADMIN_EMAIL" -p "$ADMIN_PASSWORD" || true)
    startCommand: cd apps/backend/.medusa/server && npm run start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cottson-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cottson-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: AUTH_MFA_ENCRYPTION_KEY
        generateValue: true
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: MEDUSA_BACKEND_URL
        fromService:
          type: web
          name: cottson-medusa
          property: host
      # Set these to your Vercel domain once the frontend is deployed
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      # Public URL of the frontend, used for product image URLs when seeding
      - key: FRONTEND_URL
        sync: false
      # Set both, redeploy once to create the admin login, then leave them — the "|| true"
      # above means a later deploy won't fail once the user already exists
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Key Value (Redis) stores are declared as services, not under databases: (Postgres-only)
  - type: keyvalue
    name: cottson-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction # required by Medusa's job queue
    ipAllowList: [] # internal access only

databases:
  - name: cottson-postgres
    plan: free # deleted automatically after 30 days; upgrade to a paid plan before then to keep the data
    region: singapore
    postgresMajorVersion: "16"
