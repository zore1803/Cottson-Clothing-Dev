# Local databases for the Medusa backend. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: cottson-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cottson-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
